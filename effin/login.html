<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
/* YOUR ENTIRE CSS STAYS EXACTLY THE SAME */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Courier New', Courier, monospace;
    background-color: #0a0a0a;
    color: #e0e0e0;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}
main {
    flex: 1;
    padding: 3rem 2rem;
    display: flex;
    justify-content: center;
    align-items: center;
}
.card-modern {
    background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
    border: 1px solid #333;
    border-radius: 12px;
    padding: 2.5rem;
    max-width: 450px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}
.card-modern h3 {
    margin-bottom: 1.5rem;
    color: #6d4aff;
    font-size: 1.8rem;
    text-align: center;
}
.form-stack {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
}
.form-group label {
    font-size: 0.9rem;
    color: #aaa;
    font-weight: bold;
}
.form-group input {
    background: #141414;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 0.8rem 1rem;
    color: #fff;
    font-size: 1rem;
    font-family: 'Courier New', Courier, monospace;
    transition: border-color 0.3s, box-shadow 0.3s;
}
.form-group input:focus {
    outline: none;
    border-color: #6d4aff;
    box-shadow: 0 0 0 2px rgba(109, 76, 255, 0.3);
}
.form-group input::placeholder {
    color: #666;
}
.btn-primary {
    background: linear-gradient(135deg, #6d4aff 0%, #4a33a8 100%);
    border: none;
    border-radius: 6px;
    padding: 1rem;
    color: #fff;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 1.5rem;
    transition: transform 0.2s, box-shadow 0.3s;
    font-family: 'Courier New', Courier, monospace;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(109, 76, 255, 0.4);
}
.btn-primary:active {
    transform: translateY(0);
}
</style>
</head>
<body>

<main>
<div class="card-modern">
<h3>Enter Credentials</h3>

<p id="error-msg" style="color: #ff4444; text-align: center; margin-bottom: 1rem; display: none;"></p>

<form class="form-stack" id="login-form">
<div class="form-group">
<label for="username">Username</label>
<input type="password" id="username" name="username" placeholder="Enter username" required>
</div>
<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter password" required>
</div>
<button type="submit" class="btn-primary">Login</button>
</form>
</div>
</main>

<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault(); // Stop form from reloading page

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');

    const correctUser = 'r00t';
    const correctPass = 'r00t';

if (username === correctUser && password === correctPass) {
    window.location.href = 'unlock.html';
} else {
    errorMsg.style.display = 'block';
errorMsg.textContent = 'Wrong credentials, fool.';

// Shake effect on button for flair
document.querySelector('.btn-primary').classList.add('shake');
setTimeout(() => {
    document.querySelector('.btn-primary').classList.remove('shake');
}, 500);
}
});
</script>
</body>
</html>
