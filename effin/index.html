<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" href="" />
<title>-</title>
<style>
body {
    background: #000000;
    color: #00cc00;
    font-family: monospace;
    font-size: 24px;
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
}
#out { word-break: break-all; letter-spacing: 5px; }
.blink { animation: b 1s steps(2) infinite; color: #00cc00; }
@keyframes b { 50% { opacity: 0; } }
.ok { animation: f 0.5s; }
@keyframes f { 0%,100% { color:#00cc00 } 50% { color:#00ff00; text-shadow:0 0 15px #00cc00 } }
.err { color: #cc0000; text-shadow: 0 0 5px #cc0000; animation: shake 0.3s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
</style>
</head>
<body>
<div id="out"></div><span class="blink">▌</span>
<script>
const PASS = 'effinaround';
const NEXT = 'l.html';
const out = document.getElementById('out');
let input = '';

document.addEventListener('keydown', e => {
    e.preventDefault();

    if (e.key === 'Enter') {
        if (input.toLowerCase() === PASS) {
            out.innerHTML = '<div class="ok">ACCESS GRANTED</div><div class="ok">LOADING...</div>';
            setTimeout(() => location.href = NEXT, 1200);
        } else {
            out.innerHTML = '<div class="err">DENIED</div>';
            setTimeout(() => { out.innerHTML = ''; input = ''; }, 1000);
        }
    } else if (e.key === 'Backspace') {
        input = input.slice(0, -1);
        out.textContent = '*'.repeat(input.length);
    } else if (e.key.length === 1) {
        input += e.key;
        out.textContent = '*'.repeat(input.length);
    }
});
</script>
</body>
</html>
